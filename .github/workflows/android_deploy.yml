name: Build and Release Android App Bundle

on:
  push:
    branches:
      - release 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore and Setup keystore.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_PROPERTIES: ${{ secrets.ANDROID_SIGNING_KEY_PROPERTIES }}
        run: |
          echo "Writing keystore.properties..."
          echo "$ANDROID_SIGNING_KEY_PROPERTIES" > keystore.properties
          
          echo "Decoding Keystore..."
          KEYSTORE_PATH="app/music_player.jks" 
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $KEYSTORE_PATH
          echo "Keystore decoded at $KEYSTORE_PATH"

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "Decoding google-services.json..."
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump Version Code for CI
        run: |
          # Read current values from the checked-in version.properties
          CURRENT_VERSION=$(grep "VERSION_NUMBER=" app/version.properties | cut -d'=' -f2)
          CURRENT_BUILD=$(grep "VERSION_BUILD=" app/version.properties | cut -d'=' -f2)
          
          # Add the unique GitHub Actions run number to the current versions
          # This ensures every CI run gets a strictly increasing version code
          NEW_VERSION=$((CURRENT_VERSION + ${{ github.run_number }}))
          NEW_BUILD=$((CURRENT_BUILD + ${{ github.run_number }}))
          
          # Overwrite the file on the CI runner (this will NOT be committed to your repo)
          sed -i "s/VERSION_NUMBER=.*/VERSION_NUMBER=$NEW_VERSION/" app/version.properties
          sed -i "s/VERSION_BUILD=.*/VERSION_BUILD=$NEW_BUILD/" app/version.properties
          
          echo "Bumpped CI VERSION_NUMBER to $NEW_VERSION"

      - name: Build App Bundle
        run: ./gradlew bundleRelease

      - name: Upload App Bundle to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

